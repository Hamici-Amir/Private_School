<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Private School Management System - Frontend foundation for Algerian private schools."
    />
    <title>Private School Management System</title>
    <script>
      // Pre-hydration theme resolution to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var raw = localStorage.getItem('psms.theme')
          var value = raw ? JSON.parse(raw).state.theme : 'system'
          var dark =
            value === 'dark' ||
            (value === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* ignore corrupted preferences */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
